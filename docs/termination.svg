<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1110 470" width="1110" height="470" role="img" aria-label="How a run ends: a finish decision is accepted only if the latest executor run printed an RMSE, otherwise the orchestrator is re-asked and then overridden to the executor; after each role turn the decision limit is checked; finish, the decision limit and Ctrl+C all lead to the summarizer and OUTPUT.md.">
<title>How a run ends: a finish decision is accepted only if the latest executor run printed an RMSE, otherwise the orchestrator is re-asked and then overridden to the executor; after each role turn the decision limit is checked; finish, the decision limit and Ctrl+C all lead to the summarizer and OUTPUT.md.</title>

<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.25; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
  .exe { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.75; }
  .tool { fill: #ffffff; stroke: #9a6700; stroke-width: 1.25; }
  .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.75; }
  .warn { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .file { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12.5px; }
  .lb { fill: #59636e; font-size: 12px; font-style: italic; }
  .hd { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke: #59636e; stroke-width: 1.5; }
  .ln-ok { fill: none; stroke: #1a7f37; stroke-width: 1.75; }
  .ln-warn { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
  .dash { stroke-dasharray: 5 4; }
  .ah { fill: #59636e; } .ah-ok { fill: #1a7f37; } .ah-warn { fill: #bc4c00; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .frame { stroke: #656c76; }
    .box { fill: #151b23; stroke: #656c76; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .exe { fill: #3a2d05; stroke: #d29922; }
    .tool { fill: #0d1117; stroke: #d29922; }
    .ok { fill: #04260f; stroke: #3fb950; }
    .warn { fill: #3d1d08; stroke: #f0883e; }
    .file { fill: #0d1117; stroke: #656c76; }
    .t { fill: #e6edf3; }
    .s, .lb, .hd { fill: #9198a1; }
    .ln { stroke: #9198a1; } .ln-ok { stroke: #3fb950; } .ln-warn { stroke: #f0883e; }
    .ah { fill: #9198a1; } .ah-ok { fill: #3fb950; } .ah-warn { fill: #f0883e; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ah-ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path class="ah-ok" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ah-warn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="70" width="1110" height="470" rx="12"/>
<rect class="hub" x="20" y="105" width="170" height="70" rx="10"/>
<text class="t" x="105.0" y="135.5" text-anchor="middle">orchestrator</text>
<text class="s" x="105.0" y="153.5" text-anchor="middle">decision N of max</text>
<path class="ln" d="M190,140 L230,140" marker-end="url(#ah)"/>
<polygon class="box" points="230,140 300,95 370,140 300,185"/>
<text class="t" x="300" y="145" text-anchor="middle">finish?</text>
<path class="ln" d="M370,140 L435,140" marker-end="url(#ah)"/>
<text class="lb" x="402" y="132" text-anchor="middle">yes</text>
<polygon class="box" points="435,140 520,90 605,140 520,190"/>
<text class="t" x="520" y="136" text-anchor="middle">verified</text>
<text class="t" x="520" y="154" text-anchor="middle">RMSE?</text>
<path class="ln-ok" d="M605,140 L680,140" marker-end="url(#ah-ok)"/>
<text class="lb" x="642" y="132" text-anchor="middle">yes</text>
<rect class="ok" x="680" y="105" width="180" height="70" rx="10"/>
<text class="t" x="770.0" y="135.5" text-anchor="middle">END · finish</text>
<text class="s" x="770.0" y="153.5" text-anchor="middle">result is verified</text>
<path class="ln" d="M520,190 L520,255" marker-end="url(#ah)"/>
<text class="lb" x="528" y="227" text-anchor="start">no</text>
<rect class="warn" x="435" y="255" width="170" height="70" rx="10"/>
<text class="t" x="520.0" y="276.5" text-anchor="middle">re-ask (≤ 2×)</text>
<text class="s" x="520.0" y="294.5" text-anchor="middle">with rejection note,</text>
<text class="s" x="520.0" y="312.5" text-anchor="middle">then forced to executor</text>
<path class="ln" d="M435,290 L360,290 L360,405" marker-end="url(#ah)"/>
<text class="lb" x="398" y="282" text-anchor="middle">next turn</text>
<path class="ln" d="M300,185 L300,405" marker-end="url(#ah)"/>
<text class="lb" x="308" y="300" text-anchor="start">no</text>
<rect class="box" x="205" y="405" width="190" height="70" rx="10"/>
<text class="t" x="300.0" y="426.5" text-anchor="middle">role takes the turn</text>
<text class="s" x="300.0" y="444.5" text-anchor="middle">scientist, general</text>
<text class="s" x="300.0" y="462.5" text-anchor="middle">or executor</text>
<path class="ln" d="M395,440 L435,440" marker-end="url(#ah)"/>
<polygon class="box" points="435,440 520,390 605,440 520,490"/>
<text class="t" x="520" y="436" text-anchor="middle">decisions</text>
<text class="t" x="520" y="454" text-anchor="middle">≥ max?</text>
<path class="ln-warn" d="M605,440 L680,440" marker-end="url(#ah-warn)"/>
<text class="lb" x="642" y="432" text-anchor="middle">yes</text>
<rect class="warn" x="680" y="405" width="180" height="70" rx="10"/>
<text class="t" x="770.0" y="435.5" text-anchor="middle">END · decision limit</text>
<text class="s" x="770.0" y="453.5" text-anchor="middle">default 8 · 0 = none</text>
<path class="ln" d="M520,490 L520,520 L105,520 L105,175" marker-end="url(#ah)"/>
<text class="lb" x="312" y="512" text-anchor="middle">no: next decision</text>
<rect class="warn" x="680" y="255" width="180" height="70" rx="10"/>
<text class="t" x="770.0" y="285.5" text-anchor="middle">Ctrl+C</text>
<text class="s" x="770.0" y="303.5" text-anchor="middle">at any point</text>
<rect class="box" x="930" y="255" width="160" height="70" rx="10"/>
<text class="t" x="1010.0" y="285.5" text-anchor="middle">summarizer</text>
<text class="s" x="1010.0" y="303.5" text-anchor="middle">dialogue so far</text>
<path class="ln-ok" d="M860,158 L930,268" marker-end="url(#ah-ok)"/>
<path class="ln-warn dash" d="M860,290 L930,290" marker-end="url(#ah-warn)"/>
<path class="ln-warn" d="M860,422 L930,312" marker-end="url(#ah-warn)"/>
<path class="ln" d="M1010,325 L1010,405" marker-end="url(#ah)"/>
<text class="lb" x="1018" y="369" text-anchor="start">writes</text>
<rect class="file" x="930" y="405" width="160" height="70" rx="10"/>
<text class="t m" x="1010.0" y="435.5" text-anchor="middle">OUTPUT.md</text>
<text class="s" x="1010.0" y="453.5" text-anchor="middle">always written</text>
</svg>
