<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="How a run ends: a finish is accepted only if the latest executor turn holds the required result; otherwise the orchestrator is asked again, and then you are asked whether to run the executor. After each turn the decision limit is checked. Ctrl+C at a prompt also ends the run. Every end leads to the summarizer.">
<title>How a run ends: a finish is accepted only if the latest executor turn holds the required result; otherwise the orchestrator is asked again, and then you are asked whether to run the executor. After each turn the decision limit is checked. Ctrl+C at a prompt also ends the run. Every end leads to the summarizer.</title>
<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.25; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
  .exe { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.75; }
  .tool { fill: #ffffff; stroke: #9a6700; stroke-width: 1.25; }
  .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.75; }
  .warn { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .file { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12.5px; }
  .lb { fill: #59636e; font-size: 12px; font-style: italic; }
  .hd { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke: #59636e; stroke-width: 1.5; }
  .ln-ok { fill: none; stroke: #1a7f37; stroke-width: 1.75; }
  .ln-warn { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
  .ln-exe { fill: none; stroke: #9a6700; stroke-width: 1.5; }
  .dash { stroke-dasharray: 5 4; }
  .ah { fill: #59636e; } .ah-ok { fill: #1a7f37; } .ah-warn { fill: #bc4c00; } .ah-exe { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .axis { stroke: #8c959f; stroke-width: 1; }
  .s1 { fill: none; stroke: #0969da; stroke-width: 2; stroke-linejoin: round; }
  .s2 { fill: none; stroke: #bc4c00; stroke-width: 2; stroke-linejoin: round; }
  .k1 { fill: #0969da; } .k2 { fill: #bc4c00; }
  .dot-old { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
  .dot-new { fill: #59636e; stroke: #ffffff; stroke-width: 2; }
  .led { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
  .wire { fill: none; stroke: #1f2328; stroke-width: 2; }
  .pin { fill: #1f2328; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .frame { stroke: #656c76; }
    .box { fill: #151b23; stroke: #656c76; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .exe { fill: #3a2d05; stroke: #d29922; }
    .tool { fill: #0d1117; stroke: #d29922; }
    .ok { fill: #04260f; stroke: #3fb950; }
    .warn { fill: #3d1d08; stroke: #f0883e; }
    .file { fill: #0d1117; stroke: #656c76; }
    .t { fill: #e6edf3; }
    .s, .lb, .hd { fill: #9198a1; }
    .ln { stroke: #9198a1; } .ln-ok { stroke: #3fb950; } .ln-warn { stroke: #f0883e; } .ln-exe { stroke: #d29922; }
    .ah { fill: #9198a1; } .ah-ok { fill: #3fb950; } .ah-warn { fill: #f0883e; } .ah-exe { fill: #d29922; }
    .grid { stroke: #262c36; }
    .axis { stroke: #656c76; }
    .s1 { stroke: #4493f8; } .s2 { stroke: #db6d28; }
    .k1 { fill: #4493f8; } .k2 { fill: #db6d28; }
    .dot-old { fill: #0d1117; stroke: #9198a1; }
    .dot-new { fill: #9198a1; stroke: #0d1117; }
    .led { fill: #3a2d05; stroke: #d29922; }
    .wire { stroke: #e6edf3; }
    .pin { fill: #e6edf3; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-exe" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-exe" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="900" height="520" rx="12"/>
<rect class="hub" x="20" y="50" width="180" height="70" rx="10"/>
<text class="t" x="110.0" y="81.0" text-anchor="middle">orchestrator</text>
<text class="s" x="110.0" y="99.0" text-anchor="middle">decision N (and any limit)</text>
<polygon class="box" points="245.0,85 310,45.0 375.0,85 310,125.0"/>
<text class="t" x="310" y="90" text-anchor="middle">finish?</text>
<polygon class="box" points="445.0,85 520,40.0 595.0,85 520,130.0"/>
<text class="t" x="520" y="81" text-anchor="middle">required</text>
<text class="t" x="520" y="99" text-anchor="middle">result?</text>
<rect class="ok" x="660" y="50" width="220" height="70" rx="10"/>
<text class="t" x="770.0" y="72.5" text-anchor="middle">END · finish</text>
<text class="s" x="770.0" y="90.5" text-anchor="middle">after your OK, if it reports</text>
<text class="s" x="770.0" y="107.5" text-anchor="middle">a measurement</text>
<path class="ln" d="M200,85 L245,85" marker-end="url(#ah)"/>
<path class="ln" d="M375,85 L445,85" marker-end="url(#ah)"/>
<text class="lb" x="410" y="77" text-anchor="middle">yes</text>
<path class="ln-ok" d="M595,85 L660,85" marker-end="url(#ah-ok)"/>
<text class="lb" x="627" y="77" text-anchor="middle">yes</text>
<rect class="warn" x="420" y="200" width="200" height="76" rx="10"/>
<text class="t" x="520.0" y="225.5" text-anchor="middle">finish rejected</text>
<text class="s" x="520.0" y="243.5" text-anchor="middle">asked again (≤ 2×), then</text>
<text class="s" x="520.0" y="260.5" text-anchor="middle">asks you: run the executor?</text>
<path class="ln" d="M520,130 L520,200" marker-end="url(#ah)"/>
<text class="lb" x="528" y="170" text-anchor="start">no</text>
<rect class="box" x="220" y="330" width="180" height="76" rx="10"/>
<text class="t" x="310.0" y="355.5" text-anchor="middle">the turn runs</text>
<text class="s" x="310.0" y="373.5" text-anchor="middle">a role, or a stop</text>
<text class="s" x="310.0" y="390.5" text-anchor="middle">for you</text>
<path class="ln" d="M310,125 L310,330" marker-end="url(#ah)"/>
<text class="lb" x="302" y="230" text-anchor="end">no</text>
<path class="ln" d="M420,238 L350,238 L350,330" marker-end="url(#ah)"/>
<polygon class="box" points="445.0,368 520,323.0 595.0,368 520,413.0"/>
<text class="t" x="520" y="364" text-anchor="middle">decisions</text>
<text class="t" x="520" y="382" text-anchor="middle">≥ limit?</text>
<path class="ln" d="M400,368 L445,368" marker-end="url(#ah)"/>
<rect class="warn" x="660" y="333" width="220" height="70" rx="10"/>
<text class="t" x="770.0" y="364.0" text-anchor="middle">END · decision limit</text>
<text class="s" x="770.0" y="382.0" text-anchor="middle">only with --max-decisions</text>
<path class="ln-warn" d="M595,368 L660,368" marker-end="url(#ah-warn)"/>
<text class="lb" x="627" y="360" text-anchor="middle">yes</text>
<path class="ln" d="M520,413 L520,460 L110,460 L110,120" marker-end="url(#ah)"/>
<text class="lb" x="315" y="452" text-anchor="middle">no: next decision</text>
<rect class="warn" x="660" y="200" width="220" height="76" rx="10"/>
<text class="t" x="770.0" y="225.5" text-anchor="middle">END · Ctrl+C at a prompt</text>
<text class="s" x="770.0" y="243.5" text-anchor="middle">Ctrl+C in a step cancels</text>
<text class="s" x="770.0" y="260.5" text-anchor="middle">only that step</text>
<text class="s" x="880" y="500" text-anchor="end">Every END → summarizer → OUTPUT.md, and the dialogue → transcripts/&lt;thread&gt;.md</text>
</svg>
