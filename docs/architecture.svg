<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-label="How a run works: your request is scoped, then the orchestrator hands each turn to the scientist, the general agent or the executor, or stops to ask you; the executor&#x27;s bench calls go through the hardware node; Ctrl+C in a step leads to a steering note; the run ends in the summarizer, which writes OUTPUT.md.">
<title>How a run works: your request is scoped, then the orchestrator hands each turn to the scientist, the general agent or the executor, or stops to ask you; the executor&#x27;s bench calls go through the hardware node; Ctrl+C in a step leads to a steering note; the run ends in the summarizer, which writes OUTPUT.md.</title>
<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.25; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
  .exe { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.75; }
  .tool { fill: #ffffff; stroke: #9a6700; stroke-width: 1.25; }
  .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.75; }
  .warn { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .file { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12.5px; }
  .lb { fill: #59636e; font-size: 12px; font-style: italic; }
  .hd { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke: #59636e; stroke-width: 1.5; }
  .ln-ok { fill: none; stroke: #1a7f37; stroke-width: 1.75; }
  .ln-warn { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
  .ln-exe { fill: none; stroke: #9a6700; stroke-width: 1.5; }
  .dash { stroke-dasharray: 5 4; }
  .ah { fill: #59636e; } .ah-ok { fill: #1a7f37; } .ah-warn { fill: #bc4c00; } .ah-exe { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .axis { stroke: #8c959f; stroke-width: 1; }
  .s1 { fill: none; stroke: #0969da; stroke-width: 2; stroke-linejoin: round; }
  .s2 { fill: none; stroke: #bc4c00; stroke-width: 2; stroke-linejoin: round; }
  .k1 { fill: #0969da; } .k2 { fill: #bc4c00; }
  .dot-old { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
  .dot-new { fill: #59636e; stroke: #ffffff; stroke-width: 2; }
  .led { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
  .wire { fill: none; stroke: #1f2328; stroke-width: 2; }
  .pin { fill: #1f2328; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .frame { stroke: #656c76; }
    .box { fill: #151b23; stroke: #656c76; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .exe { fill: #3a2d05; stroke: #d29922; }
    .tool { fill: #0d1117; stroke: #d29922; }
    .ok { fill: #04260f; stroke: #3fb950; }
    .warn { fill: #3d1d08; stroke: #f0883e; }
    .file { fill: #0d1117; stroke: #656c76; }
    .t { fill: #e6edf3; }
    .s, .lb, .hd { fill: #9198a1; }
    .ln { stroke: #9198a1; } .ln-ok { stroke: #3fb950; } .ln-warn { stroke: #f0883e; } .ln-exe { stroke: #d29922; }
    .ah { fill: #9198a1; } .ah-ok { fill: #3fb950; } .ah-warn { fill: #f0883e; } .ah-exe { fill: #d29922; }
    .grid { stroke: #262c36; }
    .axis { stroke: #656c76; }
    .s1 { stroke: #4493f8; } .s2 { stroke: #db6d28; }
    .k1 { fill: #4493f8; } .k2 { fill: #db6d28; }
    .dot-old { fill: #0d1117; stroke: #9198a1; }
    .dot-new { fill: #9198a1; stroke: #0d1117; }
    .led { fill: #3a2d05; stroke: #d29922; }
    .wire { stroke: #e6edf3; }
    .pin { fill: #e6edf3; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-exe" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-exe" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1120" height="580" rx="12"/>
<rect class="frame" x="290" y="20" width="810" height="420" rx="12"/>
<text class="hd" x="1086" y="410" text-anchor="end">LANGGRAPH GRAPH</text>
<text class="s" x="1086" y="428" text-anchor="end">state: messages [{role, text}] + request scope</text>
<rect class="box" x="20" y="50" width="240" height="64" rx="10"/>
<text class="t" x="140.0" y="78.0" text-anchor="middle">your request</text>
<text class="s" x="140.0" y="96.0" text-anchor="middle">prompt, --request or --task</text>
<rect class="hub" x="20" y="180" width="240" height="80" rx="10"/>
<text class="t" x="140.0" y="207.5" text-anchor="middle">request scope</text>
<text class="s" x="140.0" y="225.5" text-anchor="middle">which task sheets?</text>
<text class="s" x="140.0" y="242.5" text-anchor="middle">which result to end with?</text>
<rect class="file" x="20" y="330" width="240" height="64" rx="10"/>
<text class="t m" x="140.0" y="358.0" text-anchor="middle">task/*.pdf</text>
<text class="s" x="140.0" y="376.0" text-anchor="middle">sheets and data, if needed</text>
<path class="ln" d="M140,114 L140,180" marker-end="url(#ah)"/>
<path class="ln dash" d="M140,330 L140,260" marker-end="url(#ah)"/>
<path class="ln" d="M260,215 L380,215" marker-end="url(#ah)"/>
<rect class="hub" x="380" y="180" width="200" height="90" rx="10"/>
<text class="t" x="480.0" y="212.5" text-anchor="middle">orchestrator</text>
<text class="s" x="480.0" y="230.5" text-anchor="middle">one decision per turn</text>
<text class="s" x="480.0" y="247.5" text-anchor="middle">+ finish guard</text>
<rect class="box" x="660" y="50" width="200" height="60" rx="10"/>
<text class="t" x="760.0" y="76.0" text-anchor="middle">scientist</text>
<text class="s" x="760.0" y="94.0" text-anchor="middle">plans, no code</text>
<rect class="box" x="660" y="140" width="200" height="60" rx="10"/>
<text class="t" x="760.0" y="166.0" text-anchor="middle">general</text>
<text class="s" x="760.0" y="184.0" text-anchor="middle">explains, no code</text>
<rect class="exe" x="660" y="225" width="200" height="70" rx="10"/>
<text class="t" x="760.0" y="247.5" text-anchor="middle">executor</text>
<text class="s" x="760.0" y="265.5" text-anchor="middle">scripts, web search,</text>
<text class="s" x="760.0" y="282.5" text-anchor="middle">bench tools</text>
<rect class="tool" x="900" y="230" width="180" height="60" rx="10"/>
<text class="t" x="990.0" y="256.0" text-anchor="middle">hardware</text>
<text class="s" x="990.0" y="274.0" text-anchor="middle">runs bench calls</text>
<path class="ln" d="M580,200 L660,80" marker-start="url(#ah)" marker-end="url(#ah)"/>
<path class="ln" d="M580,225 L660,170" marker-start="url(#ah)" marker-end="url(#ah)"/>
<path class="ln" d="M580,250 L660,260" marker-start="url(#ah)" marker-end="url(#ah)"/>
<path class="ln-exe" d="M860,250 L900,250" marker-end="url(#ah-exe)"/>
<path class="ln-exe" d="M900,272 L860,272" marker-end="url(#ah-exe)"/>
<text class="lb" x="970" y="120" text-anchor="middle">each role adds one</text>
<text class="lb" x="970" y="136" text-anchor="middle">message and hands</text>
<text class="lb" x="970" y="152" text-anchor="middle">the turn back</text>
<rect class="warn" x="330" y="330" width="170" height="76" rx="10"/>
<text class="t" x="415.0" y="355.5" text-anchor="middle">human stop</text>
<text class="s" x="415.0" y="373.5" text-anchor="middle">asks you; an accepted</text>
<text class="s" x="415.0" y="390.5" text-anchor="middle">step runs at once</text>
<rect class="warn" x="530" y="330" width="170" height="76" rx="10"/>
<text class="t" x="615.0" y="355.5" text-anchor="middle">steer</text>
<text class="s" x="615.0" y="373.5" text-anchor="middle">Ctrl+C in a step,</text>
<text class="s" x="615.0" y="390.5" text-anchor="middle">then your note</text>
<path class="ln-warn" d="M400,270 L400,330" marker-end="url(#ah-warn)"/>
<text class="lb" x="382" y="305" text-anchor="end">asks</text>
<path class="ln-warn" d="M440,330 L440,270" marker-end="url(#ah-warn)"/>
<text class="lb" x="448" y="305" text-anchor="start">reply</text>
<path class="ln-warn" d="M560,330 L560,270" marker-end="url(#ah-warn)"/>
<text class="lb" x="568" y="305" text-anchor="start">note</text>
<path class="ln-ok" d="M380,255 L305,255 L305,505 L330,505" marker-end="url(#ah-ok)"/>
<text class="lb" x="298" y="480" text-anchor="end">finish</text>
<rect class="ok" x="330" y="470" width="260" height="70" rx="10"/>
<text class="t" x="460.0" y="492.5" text-anchor="middle">END</text>
<text class="s" x="460.0" y="510.5" text-anchor="middle">finish, decision limit,</text>
<text class="s" x="460.0" y="527.5" text-anchor="middle">or Ctrl+C at a prompt</text>
<rect class="box" x="640" y="470" width="190" height="70" rx="10"/>
<text class="t" x="735.0" y="501.0" text-anchor="middle">summarizer</text>
<text class="s" x="735.0" y="519.0" text-anchor="middle">request + the dialogue</text>
<rect class="file" x="880" y="470" width="220" height="70" rx="10"/>
<text class="t m" x="990.0" y="501.0" text-anchor="middle">OUTPUT.md</text>
<text class="s" x="990.0" y="519.0" text-anchor="middle">+ transcripts/&lt;thread&gt;.md</text>
<path class="ln" d="M590,505 L640,505" marker-end="url(#ah)"/>
<path class="ln" d="M830,505 L880,505" marker-end="url(#ah)"/>
</svg>
