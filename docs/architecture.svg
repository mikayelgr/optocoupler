<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 670" width="1130" height="670" role="img" aria-label="Architecture: task.pdf enters the LangGraph loop as the first message; the orchestrator hands each turn to the scientist, general agent or executor, which append a reply and return the turn; only the executor uses tools; the run ends in the summarizer, which writes OUTPUT.md.">
<title>Architecture: task.pdf enters the LangGraph loop as the first message; the orchestrator hands each turn to the scientist, general agent or executor, which append a reply and return the turn; only the executor uses tools; the run ends in the summarizer, which writes OUTPUT.md.</title>

<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.25; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
  .exe { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.75; }
  .tool { fill: #ffffff; stroke: #9a6700; stroke-width: 1.25; }
  .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.75; }
  .warn { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .file { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12.5px; }
  .lb { fill: #59636e; font-size: 12px; font-style: italic; }
  .hd { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke: #59636e; stroke-width: 1.5; }
  .ln-ok { fill: none; stroke: #1a7f37; stroke-width: 1.75; }
  .ln-warn { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
  .dash { stroke-dasharray: 5 4; }
  .ah { fill: #59636e; } .ah-ok { fill: #1a7f37; } .ah-warn { fill: #bc4c00; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .frame { stroke: #656c76; }
    .box { fill: #151b23; stroke: #656c76; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .exe { fill: #3a2d05; stroke: #d29922; }
    .tool { fill: #0d1117; stroke: #d29922; }
    .ok { fill: #04260f; stroke: #3fb950; }
    .warn { fill: #3d1d08; stroke: #f0883e; }
    .file { fill: #0d1117; stroke: #656c76; }
    .t { fill: #e6edf3; }
    .s, .lb, .hd { fill: #9198a1; }
    .ln { stroke: #9198a1; } .ln-ok { stroke: #3fb950; } .ln-warn { stroke: #f0883e; }
    .ah { fill: #9198a1; } .ah-ok { fill: #3fb950; } .ah-warn { fill: #f0883e; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ah-ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path class="ah-ok" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ah-warn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1130" height="670" rx="12"/>
<rect class="file" x="20" y="245" width="150" height="60" rx="10"/>
<text class="t m" x="95.0" y="270.5" text-anchor="middle">task.pdf</text>
<text class="s" x="95.0" y="288.5" text-anchor="middle">via pymupdf</text>
<path class="ln" d="M170,275 L258,275" marker-end="url(#ah)"/>
<text class="lb" x="200" y="266" text-anchor="middle">user msg</text>
<rect class="frame" x="230" y="40" width="580" height="480" rx="14"/>
<text class="t" x="250" y="68" text-anchor="start">LangGraph StateGraph</text>
<text class="s" x="250" y="87" text-anchor="start">shared state: messages [{role, text}]</text>
<rect class="hub" x="260" y="225" width="210" height="100" rx="10"/>
<text class="t" x="365.0" y="252.5" text-anchor="middle">orchestrator</text>
<text class="s" x="365.0" y="270.5" text-anchor="middle">reads dialogue + files</text>
<text class="s" x="365.0" y="288.5" text-anchor="middle">returns next_role,</text>
<text class="s" x="365.0" y="306.5" text-anchor="middle">instruction, reason</text>
<rect class="box" x="590" y="90" width="200" height="60" rx="10"/>
<text class="t" x="690.0" y="115.5" text-anchor="middle">scientist</text>
<text class="s" x="690.0" y="133.5" text-anchor="middle">DE, network, plan</text>
<rect class="box" x="590" y="245" width="200" height="60" rx="10"/>
<text class="t" x="690.0" y="270.5" text-anchor="middle">general</text>
<text class="s" x="690.0" y="288.5" text-anchor="middle">concepts, no code</text>
<rect class="exe" x="590" y="400" width="200" height="60" rx="10"/>
<text class="t" x="690.0" y="425.5" text-anchor="middle">executor</text>
<text class="s" x="690.0" y="443.5" text-anchor="middle">writes + runs scripts</text>
<path class="ln" d="M470,240 L590,112" marker-end="url(#ah)"/>
<path class="ln dash" d="M590,128 L470,252" marker-end="url(#ah)"/>
<path class="ln" d="M470,268 L590,268" marker-end="url(#ah)"/>
<path class="ln dash" d="M590,282 L470,282" marker-end="url(#ah)"/>
<path class="ln" d="M470,298 L590,422" marker-end="url(#ah)"/>
<path class="ln dash" d="M590,438 L470,310" marker-end="url(#ah)"/>
<path class="ln" d="M600,488 L632,488" marker-end="url(#ah)"/>
<text class="s" x="640" y="492" text-anchor="start">hands turn to role</text>
<path class="ln dash" d="M600,507 L632,507" marker-end="url(#ah)"/>
<text class="s" x="640" y="511" text-anchor="start">appends reply, returns</text>
<text class="hd" x="1005" y="302" text-anchor="middle">EXECUTOR-ONLY TOOLS</text>
<rect class="tool" x="900" y="316" width="210" height="66" rx="10"/>
<text class="t m" x="1005.0" y="335.5" text-anchor="middle">web_search_tool</text>
<text class="s" x="1005.0" y="353.5" text-anchor="middle">OpenRouter web plugin</text>
<text class="s" x="1005.0" y="371.5" text-anchor="middle">≤ 3 rounds per turn</text>
<rect class="tool" x="900" y="394" width="210" height="66" rx="10"/>
<text class="t m" x="1005.0" y="413.5" text-anchor="middle">dependency_tool</text>
<text class="s" x="1005.0" y="431.5" text-anchor="middle">uv add</text>
<text class="s" x="1005.0" y="449.5" text-anchor="middle">→ pyproject.toml, uv.lock</text>
<rect class="tool" x="900" y="472" width="210" height="66" rx="10"/>
<text class="t m" x="1005.0" y="491.5" text-anchor="middle">code_tool</text>
<text class="s" x="1005.0" y="509.5" text-anchor="middle">uv run, 5 min timeout</text>
<text class="s" x="1005.0" y="527.5" text-anchor="middle">→ exit code, stdout, stderr</text>
<path class="ln" d="M790,418 L900,349" marker-end="url(#ah)"/>
<path class="ln" d="M790,430 L900,427" marker-end="url(#ah)"/>
<path class="ln" d="M790,442 L900,505" marker-end="url(#ah)"/>
<rect class="file" x="900" y="584" width="210" height="66" rx="10"/>
<text class="t" x="1005.0" y="603.5" text-anchor="middle">working directory</text>
<text class="s" x="1005.0" y="621.5" text-anchor="middle">one temp folder per run</text>
<text class="s" x="1005.0" y="639.5" text-anchor="middle">data, scripts, downloads</text>
<path class="ln" d="M1005,538 L1005,584" marker-end="url(#ah)"/>
<text class="lb" x="1013" y="565" text-anchor="start">runs in</text>
<rect class="file" x="600" y="590" width="190" height="60" rx="10"/>
<text class="t m" x="695.0" y="615.5" text-anchor="middle">SNLS80mV.mat</text>
<text class="s" x="695.0" y="633.5" text-anchor="middle">project root</text>
<path class="ln" d="M790,620 L900,620" marker-end="url(#ah)"/>
<text class="lb" x="845" y="598" text-anchor="middle">copied at</text>
<text class="lb" x="845" y="611" text-anchor="middle">startup</text>
<path class="ln-ok" d="M340,325 L340,584" marker-end="url(#ah-ok)"/>
<text class="lb" x="332" y="548" text-anchor="end">finish</text>
<text class="lb" x="332" y="563" text-anchor="end">(RMSE verified)</text>
<path class="ln-warn dash" d="M420,520 L420,584" marker-end="url(#ah-warn)"/>
<text class="lb" x="428" y="548" text-anchor="start">decision limit</text>
<text class="lb" x="428" y="563" text-anchor="start">or Ctrl+C</text>
<rect class="box" x="260" y="584" width="210" height="60" rx="10"/>
<text class="t" x="365.0" y="609.5" text-anchor="middle">summarizer</text>
<text class="s" x="365.0" y="627.5" text-anchor="middle">scientist + executor msgs</text>
<path class="ln" d="M260,614 L170,614" marker-end="url(#ah)"/>
<text class="lb" x="215" y="606" text-anchor="middle">writes</text>
<rect class="file" x="20" y="584" width="150" height="60" rx="10"/>
<text class="t m" x="95.0" y="609.5" text-anchor="middle">OUTPUT.md</text>
<text class="s" x="95.0" y="627.5" text-anchor="middle">4-section report</text>
</svg>
