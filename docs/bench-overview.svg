<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="The bench&#x27;s software path: the executor&#x27;s tool calls go through the hardware node, and a script&#x27;s bench_tools calls through a local HTTP bridge; both use the pipeline&#x27;s one MCP session to bench/server.py, which drives the Pico over USB serial and reads phyphox on the phone over HTTP.">
<title>The bench&#x27;s software path: the executor&#x27;s tool calls go through the hardware node, and a script&#x27;s bench_tools calls through a local HTTP bridge; both use the pipeline&#x27;s one MCP session to bench/server.py, which drives the Pico over USB serial and reads phyphox on the phone over HTTP.</title>
<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.25; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
  .exe { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.75; }
  .tool { fill: #ffffff; stroke: #9a6700; stroke-width: 1.25; }
  .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.75; }
  .warn { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .file { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12.5px; }
  .lb { fill: #59636e; font-size: 12px; font-style: italic; }
  .hd { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke: #59636e; stroke-width: 1.5; }
  .ln-ok { fill: none; stroke: #1a7f37; stroke-width: 1.75; }
  .ln-warn { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
  .ln-exe { fill: none; stroke: #9a6700; stroke-width: 1.5; }
  .dash { stroke-dasharray: 5 4; }
  .ah { fill: #59636e; } .ah-ok { fill: #1a7f37; } .ah-warn { fill: #bc4c00; } .ah-exe { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .axis { stroke: #8c959f; stroke-width: 1; }
  .s1 { fill: none; stroke: #0969da; stroke-width: 2; stroke-linejoin: round; }
  .s2 { fill: none; stroke: #bc4c00; stroke-width: 2; stroke-linejoin: round; }
  .k1 { fill: #0969da; } .k2 { fill: #bc4c00; }
  .dot-old { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
  .dot-new { fill: #59636e; stroke: #ffffff; stroke-width: 2; }
  .led { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
  .wire { fill: none; stroke: #1f2328; stroke-width: 2; }
  .pin { fill: #1f2328; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .frame { stroke: #656c76; }
    .box { fill: #151b23; stroke: #656c76; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .exe { fill: #3a2d05; stroke: #d29922; }
    .tool { fill: #0d1117; stroke: #d29922; }
    .ok { fill: #04260f; stroke: #3fb950; }
    .warn { fill: #3d1d08; stroke: #f0883e; }
    .file { fill: #0d1117; stroke: #656c76; }
    .t { fill: #e6edf3; }
    .s, .lb, .hd { fill: #9198a1; }
    .ln { stroke: #9198a1; } .ln-ok { stroke: #3fb950; } .ln-warn { stroke: #f0883e; } .ln-exe { stroke: #d29922; }
    .ah { fill: #9198a1; } .ah-ok { fill: #3fb950; } .ah-warn { fill: #f0883e; } .ah-exe { fill: #d29922; }
    .grid { stroke: #262c36; }
    .axis { stroke: #656c76; }
    .s1 { stroke: #4493f8; } .s2 { stroke: #db6d28; }
    .k1 { fill: #4493f8; } .k2 { fill: #db6d28; }
    .dot-old { fill: #0d1117; stroke: #9198a1; }
    .dot-new { fill: #9198a1; stroke: #0d1117; }
    .led { fill: #3a2d05; stroke: #d29922; }
    .wire { stroke: #e6edf3; }
    .pin { fill: #e6edf3; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-exe" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-exe" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1100" height="330" rx="12"/>
<rect class="frame" x="10" y="10" width="640" height="300" rx="12"/>
<text class="hd" x="636" y="298" text-anchor="end">PIPELINE PROCESS</text>
<rect class="exe" x="30" y="40" width="180" height="70" rx="10"/>
<text class="t" x="120.0" y="71.0" text-anchor="middle">executor</text>
<text class="s" x="120.0" y="89.0" text-anchor="middle">tool calls in a reply</text>
<rect class="exe" x="30" y="170" width="180" height="70" rx="10"/>
<text class="t" x="120.0" y="201.0" text-anchor="middle">script</text>
<text class="s m" x="120.0" y="219.0" text-anchor="middle">import bench_tools</text>
<rect class="tool" x="250" y="40" width="170" height="70" rx="10"/>
<text class="t" x="335.0" y="71.0" text-anchor="middle">hardware node</text>
<text class="s" x="335.0" y="89.0" text-anchor="middle">runs them in order</text>
<rect class="tool" x="250" y="170" width="170" height="70" rx="10"/>
<text class="t" x="335.0" y="201.0" text-anchor="middle">HTTP bridge</text>
<text class="s" x="335.0" y="219.0" text-anchor="middle">127.0.0.1 + token</text>
<rect class="hub" x="460" y="95" width="170" height="90" rx="10"/>
<text class="t" x="545.0" y="127.5" text-anchor="middle">MCP session</text>
<text class="s" x="545.0" y="145.5" text-anchor="middle">one for the whole run</text>
<text class="s" x="545.0" y="162.5" text-anchor="middle">chain/bench.py</text>
<path class="ln-exe" d="M210,75 L250,75" marker-end="url(#ah-exe)"/>
<path class="ln-exe" d="M210,205 L250,205" marker-end="url(#ah-exe)"/>
<path class="ln" d="M420,75 L440,75 L440,125 L460,125" marker-end="url(#ah)"/>
<path class="ln" d="M420,205 L440,205 L440,155 L460,155" marker-end="url(#ah)"/>
<text class="s" x="30" y="282" text-anchor="start">Script calls take under 1 ms each through the bridge and the session.</text>
<rect class="hub" x="690" y="95" width="170" height="90" rx="10"/>
<text class="t m" x="775.0" y="127.5" text-anchor="middle">bench/server.py</text>
<text class="s" x="775.0" y="145.5" text-anchor="middle">set_led · led_off</text>
<text class="s" x="775.0" y="162.5" text-anchor="middle">read_lux</text>
<path class="ln" d="M630,140 L690,140" marker-end="url(#ah)"/>
<text class="lb" x="656" y="132" text-anchor="start">stdio</text>
<rect class="box" x="910" y="40" width="170" height="70" rx="10"/>
<text class="t" x="995.0" y="71.0" text-anchor="middle">Pico</text>
<text class="s" x="995.0" y="89.0" text-anchor="middle">LED on GP15 (PWM)</text>
<rect class="box" x="910" y="170" width="170" height="70" rx="10"/>
<text class="t" x="995.0" y="201.0" text-anchor="middle">phone</text>
<text class="s" x="995.0" y="219.0" text-anchor="middle">phyphox light sensor</text>
<path class="ln" d="M860,120 L885,120 L885,75 L910,75" marker-end="url(#ah)"/>
<text class="lb" x="895" y="30" text-anchor="middle">USB serial</text>
<path class="ln" d="M860,160 L885,160 L885,205 L910,205" marker-end="url(#ah)"/>
<text class="lb" x="895" y="260" text-anchor="middle">HTTP</text>
<text class="s" x="775" y="207" text-anchor="middle">own process; Ctrl+C</text>
<text class="s" x="775" y="223" text-anchor="middle">doesn&#x27;t reach it</text>
</svg>
