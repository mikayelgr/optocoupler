<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="Cancel and steer: Ctrl+C while a step runs drops that step and records a system note; you type a note, the request is re-scoped, and the orchestrator decides next. Ctrl+C at the note, or a reached decision limit, ends the run.">
<title>Cancel and steer: Ctrl+C while a step runs drops that step and records a system note; you type a note, the request is re-scoped, and the orchestrator decides next. Ctrl+C at the note, or a reached decision limit, ends the run.</title>
<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.25; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
  .exe { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.75; }
  .tool { fill: #ffffff; stroke: #9a6700; stroke-width: 1.25; }
  .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.75; }
  .warn { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .file { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12.5px; }
  .lb { fill: #59636e; font-size: 12px; font-style: italic; }
  .hd { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke: #59636e; stroke-width: 1.5; }
  .ln-ok { fill: none; stroke: #1a7f37; stroke-width: 1.75; }
  .ln-warn { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
  .ln-exe { fill: none; stroke: #9a6700; stroke-width: 1.5; }
  .dash { stroke-dasharray: 5 4; }
  .ah { fill: #59636e; } .ah-ok { fill: #1a7f37; } .ah-warn { fill: #bc4c00; } .ah-exe { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .axis { stroke: #8c959f; stroke-width: 1; }
  .s1 { fill: none; stroke: #0969da; stroke-width: 2; stroke-linejoin: round; }
  .s2 { fill: none; stroke: #bc4c00; stroke-width: 2; stroke-linejoin: round; }
  .k1 { fill: #0969da; } .k2 { fill: #bc4c00; }
  .dot-old { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
  .dot-new { fill: #59636e; stroke: #ffffff; stroke-width: 2; }
  .led { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
  .wire { fill: none; stroke: #1f2328; stroke-width: 2; }
  .pin { fill: #1f2328; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .frame { stroke: #656c76; }
    .box { fill: #151b23; stroke: #656c76; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .exe { fill: #3a2d05; stroke: #d29922; }
    .tool { fill: #0d1117; stroke: #d29922; }
    .ok { fill: #04260f; stroke: #3fb950; }
    .warn { fill: #3d1d08; stroke: #f0883e; }
    .file { fill: #0d1117; stroke: #656c76; }
    .t { fill: #e6edf3; }
    .s, .lb, .hd { fill: #9198a1; }
    .ln { stroke: #9198a1; } .ln-ok { stroke: #3fb950; } .ln-warn { stroke: #f0883e; } .ln-exe { stroke: #d29922; }
    .ah { fill: #9198a1; } .ah-ok { fill: #3fb950; } .ah-warn { fill: #f0883e; } .ah-exe { fill: #d29922; }
    .grid { stroke: #262c36; }
    .axis { stroke: #656c76; }
    .s1 { stroke: #4493f8; } .s2 { stroke: #db6d28; }
    .k1 { fill: #4493f8; } .k2 { fill: #db6d28; }
    .dot-old { fill: #0d1117; stroke: #9198a1; }
    .dot-new { fill: #9198a1; stroke: #0d1117; }
    .led { fill: #3a2d05; stroke: #d29922; }
    .wire { stroke: #e6edf3; }
    .pin { fill: #e6edf3; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-exe" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-exe" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1120" height="300" rx="12"/>
<rect class="exe" x="20" y="40" width="190" height="84" rx="10"/>
<text class="t" x="115.0" y="69.5" text-anchor="middle">a step runs</text>
<text class="s" x="115.0" y="87.5" text-anchor="middle">a reply, a decision,</text>
<text class="s" x="115.0" y="104.5" text-anchor="middle">a script or a bench call</text>
<rect class="warn" x="252" y="40" width="190" height="84" rx="10"/>
<text class="t" x="347.0" y="69.5" text-anchor="middle">step dropped</text>
<text class="s" x="347.0" y="87.5" text-anchor="middle">a system message</text>
<text class="s" x="347.0" y="104.5" text-anchor="middle">records what stopped</text>
<rect class="warn" x="484" y="40" width="190" height="84" rx="10"/>
<text class="t" x="579.0" y="69.5" text-anchor="middle">your note</text>
<text class="s" x="579.0" y="87.5" text-anchor="middle">the steer prompt;</text>
<text class="s" x="579.0" y="104.5" text-anchor="middle">joins as role human</text>
<rect class="hub" x="716" y="40" width="190" height="84" rx="10"/>
<text class="t" x="811.0" y="69.5" text-anchor="middle">request re-scoped</text>
<text class="s" x="811.0" y="87.5" text-anchor="middle">the note can change</text>
<text class="s" x="811.0" y="104.5" text-anchor="middle">the required result</text>
<rect class="hub" x="948" y="40" width="190" height="84" rx="10"/>
<text class="t" x="1043.0" y="69.5" text-anchor="middle">orchestrator</text>
<text class="s" x="1043.0" y="87.5" text-anchor="middle">decides next,</text>
<text class="s" x="1043.0" y="104.5" text-anchor="middle">following the note</text>
<path class="ln-warn" d="M210,82.0 L252,82.0" marker-end="url(#ah-warn)"/>
<text class="lb" x="231.0" y="74.0" text-anchor="middle">Ctrl+C</text>
<path class="ln" d="M442,82.0 L484,82.0" marker-end="url(#ah)"/>
<path class="ln" d="M674,82.0 L716,82.0" marker-end="url(#ah)"/>
<path class="ln" d="M906,82.0 L948,82.0" marker-end="url(#ah)"/>
<rect class="ok" x="20" y="200" width="654" height="70" rx="10"/>
<text class="t" x="347.0" y="231.0" text-anchor="middle">END</text>
<text class="s" x="347.0" y="249.0" text-anchor="middle">summary and transcript of the work so far</text>
<path class="ln-ok" d="M115.0,124 L115.0,200" marker-end="url(#ah-ok)"/>
<text class="lb" x="123.0" y="165" text-anchor="start">Ctrl+C, no decision left</text>
<path class="ln-ok" d="M579.0,124 L579.0,200" marker-end="url(#ah-ok)"/>
<text class="lb" x="587.0" y="165" text-anchor="start">Ctrl+C again</text>
<text class="s" x="726" y="225" text-anchor="start">Files a cancelled script already wrote, and LED</text>
<text class="s" x="726" y="243" text-anchor="start">settings it already made, stay as they are.</text>
</svg>
