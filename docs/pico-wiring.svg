  .lead { fill: none; stroke: #8c959f; stroke-width: 2.25; stroke-linecap: round; }
  .res { fill: #e9d7ad; stroke: #9a6700; stroke-width: 1.25; }
  .b-red { fill: #cf222e; } .b-brown { fill: #6f3b17; } .b-gold { fill: #c69026; }
  .led-body { fill: #ffe46b; fill-opacity: 0.85; stroke: #9a6700; stroke-width: 1.5; }
  .ray { fill: none; stroke: #d4a72c; stroke-width: 2; stroke-linecap: round; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
