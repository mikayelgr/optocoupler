<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" aria-label="A Raspberry Pi Pico seen from the top, USB at the top edge. Physical pin 20 (GP15), the bottom pin on the left side, goes through a resistor (any value from 220 to 330 ohms) to the LED's long leg (anode). The LED's short leg (cathode) goes back to pin 18, a GND pin two places above it.">
<title>A Raspberry Pi Pico seen from the top, USB at the top edge. Physical pin 20 (GP15), the bottom pin on the left side, goes through a resistor (any value from 220 to 330 ohms) to the LED's long leg (anode). The LED's short leg (cathode) goes back to pin 18, a GND pin two places above it.</title>
<style>
