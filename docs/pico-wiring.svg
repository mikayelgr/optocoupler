  .hot-t { fill: #bc4c00; font-size: 13px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .pcb { fill: #24603a; stroke: #3fb950; }
    .hot { stroke: #f0883e; }
    .wire-gnd { stroke: #e6edf3; }
