<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="One executor turn: the prompt is built and the model replies. Tool calls go to the hardware node and back; a search block runs a web search and the executor is asked again; a python block is run as a script after any packages are added; without code the reply is a bench report or a failure.">
<title>One executor turn: the prompt is built and the model replies. Tool calls go to the hardware node and back; a search block runs a web search and the executor is asked again; a python block is run as a script after any packages are added; without code the reply is a bench report or a failure.</title>
<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.25; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
  .exe { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.75; }
  .tool { fill: #ffffff; stroke: #9a6700; stroke-width: 1.25; }
  .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.75; }
  .warn { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .file { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12.5px; }
  .lb { fill: #59636e; font-size: 12px; font-style: italic; }
  .hd { fill: #59636e; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke: #59636e; stroke-width: 1.5; }
  .ln-ok { fill: none; stroke: #1a7f37; stroke-width: 1.75; }
  .ln-warn { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
  .ln-exe { fill: none; stroke: #9a6700; stroke-width: 1.5; }
  .dash { stroke-dasharray: 5 4; }
  .ah { fill: #59636e; } .ah-ok { fill: #1a7f37; } .ah-warn { fill: #bc4c00; } .ah-exe { fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .axis { stroke: #8c959f; stroke-width: 1; }
  .s1 { fill: none; stroke: #0969da; stroke-width: 2; stroke-linejoin: round; }
  .s2 { fill: none; stroke: #bc4c00; stroke-width: 2; stroke-linejoin: round; }
  .k1 { fill: #0969da; } .k2 { fill: #bc4c00; }
  .dot-old { fill: #ffffff; stroke: #59636e; stroke-width: 2; }
  .dot-new { fill: #59636e; stroke: #ffffff; stroke-width: 2; }
  .led { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
  .wire { fill: none; stroke: #1f2328; stroke-width: 2; }
  .pin { fill: #1f2328; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .frame { stroke: #656c76; }
    .box { fill: #151b23; stroke: #656c76; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .exe { fill: #3a2d05; stroke: #d29922; }
    .tool { fill: #0d1117; stroke: #d29922; }
    .ok { fill: #04260f; stroke: #3fb950; }
    .warn { fill: #3d1d08; stroke: #f0883e; }
    .file { fill: #0d1117; stroke: #656c76; }
    .t { fill: #e6edf3; }
    .s, .lb, .hd { fill: #9198a1; }
    .ln { stroke: #9198a1; } .ln-ok { stroke: #3fb950; } .ln-warn { stroke: #f0883e; } .ln-exe { stroke: #d29922; }
    .ah { fill: #9198a1; } .ah-ok { fill: #3fb950; } .ah-warn { fill: #f0883e; } .ah-exe { fill: #d29922; }
    .grid { stroke: #262c36; }
    .axis { stroke: #656c76; }
    .s1 { stroke: #4493f8; } .s2 { stroke: #db6d28; }
    .k1 { fill: #4493f8; } .k2 { fill: #db6d28; }
    .dot-old { fill: #0d1117; stroke: #9198a1; }
    .dot-new { fill: #9198a1; stroke: #0d1117; }
    .led { fill: #3a2d05; stroke: #d29922; }
    .wire { stroke: #e6edf3; }
    .pin { fill: #e6edf3; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-warn" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ah-exe" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-exe" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1100" height="440" rx="12"/>
<rect class="box" x="20" y="60" width="150" height="76" rx="10"/>
<text class="t" x="95.0" y="85.5" text-anchor="middle">build prompt</text>
<text class="s" x="95.0" y="103.5" text-anchor="middle">exe.md, formats,</text>
<text class="s" x="95.0" y="120.5" text-anchor="middle">files, dialogue</text>
<rect class="exe" x="205" y="60" width="150" height="76" rx="10"/>
<text class="t" x="280.0" y="85.5" text-anchor="middle">model reply</text>
<text class="s" x="280.0" y="103.5" text-anchor="middle">streamed; bench</text>
<text class="s" x="280.0" y="120.5" text-anchor="middle">tools if --bench</text>
<path class="ln" d="M170,98 L205,98" marker-end="url(#ah)"/>
<polygon class="box" points="390.0,98 455,55.0 520.0,98 455,141.0"/>
<text class="t" x="455" y="94" text-anchor="middle">tool</text>
<text class="t" x="455" y="112" text-anchor="middle">calls?</text>
<polygon class="box" points="550.0,98 615,55.0 680.0,98 615,141.0"/>
<text class="t" x="615" y="94" text-anchor="middle">search</text>
<text class="t" x="615" y="112" text-anchor="middle">block?</text>
<polygon class="box" points="710.0,98 775,55.0 840.0,98 775,141.0"/>
<text class="t" x="775" y="94" text-anchor="middle">python</text>
<text class="t" x="775" y="112" text-anchor="middle">block?</text>
<path class="ln" d="M355,98 L390,98" marker-end="url(#ah)"/>
<path class="ln" d="M520,98 L550,98" marker-end="url(#ah)"/>
<text class="lb" x="535" y="90" text-anchor="middle">no</text>
<path class="ln" d="M680,98 L710,98" marker-end="url(#ah)"/>
<text class="lb" x="695" y="90" text-anchor="middle">no</text>
<rect class="exe" x="880" y="60" width="200" height="76" rx="10"/>
<text class="t" x="980.0" y="85.5" text-anchor="middle">run the script</text>
<text class="s" x="980.0" y="103.5" text-anchor="middle">adds listed packages,</text>
<text class="s" x="980.0" y="120.5" text-anchor="middle">runs it, 5-minute limit</text>
<path class="ln" d="M840,98 L880,98" marker-end="url(#ah)"/>
<text class="lb" x="860" y="90" text-anchor="middle">yes</text>
<rect class="tool" x="385" y="240" width="140" height="70" rx="10"/>
<text class="t" x="455.0" y="262.5" text-anchor="middle">hardware</text>
<text class="s" x="455.0" y="280.5" text-anchor="middle">calls in order,</text>
<text class="s" x="455.0" y="297.5" text-anchor="middle">≤ 12 per turn</text>
<rect class="tool" x="545" y="240" width="140" height="70" rx="10"/>
<text class="t" x="615.0" y="262.5" text-anchor="middle">web search</text>
<text class="s" x="615.0" y="280.5" text-anchor="middle">≤ 3 queries,</text>
<text class="s" x="615.0" y="297.5" text-anchor="middle">≤ 3 rounds</text>
<rect class="box" x="705" y="240" width="140" height="70" rx="10"/>
<text class="t" x="775.0" y="262.5" text-anchor="middle">no script</text>
<text class="s" x="775.0" y="280.5" text-anchor="middle">bench report,</text>
<text class="s" x="775.0" y="297.5" text-anchor="middle">else a failure</text>
<rect class="ok" x="880" y="240" width="200" height="70" rx="10"/>
<text class="t" x="980.0" y="262.5" text-anchor="middle">executor message</text>
<text class="s" x="980.0" y="280.5" text-anchor="middle">exit code, stdout, stderr</text>
<text class="s" x="980.0" y="297.5" text-anchor="middle">+ a script&#x27;s bench calls</text>
<path class="ln-exe" d="M455,141 L455,240" marker-end="url(#ah-exe)"/>
<text class="lb" x="463" y="195" text-anchor="start">yes</text>
<path class="ln" d="M615,141 L615,240" marker-end="url(#ah)"/>
<text class="lb" x="623" y="195" text-anchor="start">yes</text>
<path class="ln" d="M775,141 L775,240" marker-end="url(#ah)"/>
<text class="lb" x="783" y="195" text-anchor="start">no</text>
<path class="ln" d="M980,136 L980,240" marker-end="url(#ah)"/>
<path class="ln" d="M845,275 L880,275" marker-end="url(#ah)"/>
<path class="ln-exe" d="M455,310 L455,360 L100,360 L100,136" marker-end="url(#ah-exe)"/>
<text class="lb" x="270" y="352" text-anchor="middle">results in a hardware message; asked again</text>
<path class="ln" d="M615,310 L615,400 L60,400 L60,136" marker-end="url(#ah)"/>
<text class="lb" x="330" y="392" text-anchor="middle">results added to the prompt; asked again</text>
</svg>
